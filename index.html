<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.scene{display:flex;align-items:center;gap:40px;max-width:780px;width:100%}

/* Phone */
.phone-frame{background:#1a1a2e;border-radius:44px;padding:13px;box-shadow:0 0 0 2px #2a2a3e,0 24px 60px rgba(0,0,0,.5);width:260px;flex-shrink:0}
.phone-screen{border-radius:32px;overflow:hidden;background:#fff;height:520px;display:flex;flex-direction:column;position:relative}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:24px;background:#1a1a2e;border-radius:0 0 16px 16px;z-index:10;display:flex;align-items:center;justify-content:center;gap:5px}
.notch-cam{width:7px;height:7px;border-radius:50%;background:#2a2a3e;border:1.5px solid #3a3a5e}
.notch-spk{width:34px;height:3px;border-radius:2px;background:#2a2a3e}

/* Screen inner */
.screen-inner{padding-top:24px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.s-header{background:#1a1a2e;padding:10px 12px 7px;text-align:center;flex-shrink:0}
.s-logo{font-size:8px;color:#a0aec0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.s-header h1{color:#fff;font-size:12px;font-weight:500}
.s-sub{font-size:8.5px;color:#a0aec0;margin-top:2px}
.s-stepbar{display:flex;border-bottom:0.5px solid #e8eaf0;background:#fff;flex-shrink:0}
.s-step{flex:1;padding:6px 0;text-align:center;font-size:7.5px;color:#9aa0b0;display:flex;align-items:center;justify-content:center;gap:3px}
.s-step.active{color:#4f46e5;font-weight:500}
.s-step.done{color:#16a34a}
.s-step .n{width:13px;height:13px;border-radius:50%;border:1px solid currentColor;font-size:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-step.done .n{background:#16a34a;border-color:#16a34a;color:#fff}
.s-step.active .n{background:#4f46e5;border-color:#4f46e5;color:#fff}

/* Scrollable body */
.s-body{flex:1;overflow-y:auto;padding:10px 11px 10px;background:#fff}
.s-body::-webkit-scrollbar{display:none}

/* Home bar */
.s-homebar{height:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-top:0.5px solid #f0f0f0}
.s-homebar div{width:70px;height:3px;background:#d1d5db;border-radius:2px}

/* Micro UI elements */
.s-title{font-size:11px;font-weight:500;color:#1a1a2e;margin-bottom:3px}
.s-desc{font-size:8.5px;color:#6b7280;margin-bottom:8px;line-height:1.5}
.m-section{margin-bottom:8px}
.m-label{font-size:8px;font-weight:500;color:#374151;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.m-icon{width:14px;height:14px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:500}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.m-btn{border:0.5px solid #d1d5db;border-radius:7px;padding:7px 4px;text-align:center;cursor:pointer;transition:all .15s;background:#fff;user-select:none}
.m-btn:hover{border-color:#4f46e5;background:#f8f8ff}
.m-btn.sel{border-color:#4f46e5;background:#f0efff;border-width:1.5px}
.m-num{font-size:12px;font-weight:500;color:#1a1a2e}
.m-btn.sel .m-num{color:#4f46e5}
.m-stat{font-size:7px;color:#9ca3af}
.m-btn.sel .m-stat{color:#4f46e5}
.legend{display:flex;gap:10px;margin-bottom:8px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:8px;color:#6b7280}
.leg-dot{width:8px;height:8px;border-radius:2px;border:0.5px solid #d1d5db}
.leg-dot.sel{background:#f0efff;border-color:#4f46e5}
.s-radio{display:flex;gap:5px;margin-bottom:7px}
.s-rbtn{flex:1;border:0.5px solid #d1d5db;border-radius:6px;padding:5px;text-align:center;font-size:8.5px;color:#374151;cursor:pointer;user-select:none}
.s-rbtn.active{border-color:#4f46e5;background:#f0efff;color:#4f46e5;font-weight:500}
.s-field{margin-bottom:7px}
.s-lbl{font-size:8px;font-weight:500;color:#374151;margin-bottom:3px}
.s-input{width:100%;height:28px;border:0.5px solid #d1d5db;border-radius:6px;padding:0 8px;font-size:9px;color:#1a1a2e;background:#fff;outline:none}
.s-input:focus{border-color:#4f46e5}
.s-hint{font-size:7.5px;color:#9ca3af;margin-top:2px}
.s-badge{display:inline-flex;align-items:center;gap:3px;background:#f0efff;border:0.5px solid #c7c7f0;border-radius:10px;padding:2px 8px;font-size:8px;color:#4f46e5;margin-bottom:7px}
.s-btn{width:100%;height:28px;background:#4f46e5;color:#fff;border:none;border-radius:7px;font-size:9px;font-weight:500;cursor:pointer;margin-top:5px;display:flex;align-items:center;justify-content:center}
.s-btn:disabled{background:#a5a5c0;cursor:not-allowed}
.s-btn.sec{background:#fff;color:#4f46e5;border:0.5px solid #4f46e5;margin-top:4px}
.s-price{background:#f8f9ff;border:0.5px solid #e0e0f0;border-radius:7px;padding:7px;margin-bottom:7px}
.s-prow{display:flex;justify-content:space-between;font-size:8.5px;color:#6b7280;padding:2px 0}
.s-prow.tot{font-size:9.5px;color:#1a1a2e;font-weight:500;border-top:0.5px solid #e0e0f0;margin-top:4px;padding-top:5px}
.s-wpbox{border:0.5px solid #e0e0f0;border-radius:8px;overflow:hidden;margin-bottom:7px}
.s-wph{background:#c8102e;padding:6px 8px;display:flex;align-items:center;gap:5px}
.s-wplogo{background:#fff;border-radius:3px;padding:1px 5px;font-size:8px;color:#c8102e;font-weight:700}
.s-wph span{color:#fff;font-size:8px;font-weight:500}
.s-wpb{padding:7px}
.s-card{background:#1a1a2e;border-radius:7px;padding:8px;margin-bottom:6px}
.s-chip{width:16px;height:11px;background:#d4af37;border-radius:2px;margin-bottom:6px}
.s-cnum{font-size:8.5px;letter-spacing:2px;font-family:monospace;color:#fff;margin-bottom:4px}
.s-cmeta{display:flex;justify-content:space-between;font-size:7px;color:#a0aec0}
.s-loadbar{height:3px;background:#e0e0f0;border-radius:2px;overflow:hidden;margin:6px 0}
.s-loadfill{height:100%;background:#c8102e;border-radius:2px;animation:loadfill 2.5s ease forwards}
@keyframes loadfill{from{width:0}to{width:100%}}
.s-check{width:36px;height:36px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.s-qrwrap{background:#fff;border:1.5px solid #1a1a2e;border-radius:8px;padding:8px;display:inline-flex;margin:0 auto 6px}
.s-qrinfo{background:#f0fdf4;border:0.5px solid #bbf7d0;border-radius:6px;padding:5px 7px;font-size:7.5px;color:#15803d;margin-bottom:5px;text-align:left}
.s-sent{display:inline-flex;align-items:center;gap:3px;background:#f0f0ff;border:0.5px solid #c7c7f0;border-radius:10px;padding:2px 8px;font-size:7.5px;color:#4f46e5;margin-bottom:5px}
.s-tag{display:inline-block;background:#f1f5f9;border-radius:3px;padding:1px 5px;font-size:7.5px;color:#64748b;font-family:monospace}
.s-mtag{display:inline-flex;align-items:center;background:#f0efff;border-radius:5px;padding:2px 7px;font-size:8px;color:#4f46e5;font-weight:500;margin-bottom:6px}

/* Info panel */
.info-panel{flex:1;color:#fff}
.step-pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff0d;border:0.5px solid #ffffff18;border-radius:20px;padding:4px 12px;font-size:11px;color:#818cf8;margin-bottom:10px}
.step-pill .dot{width:6px;height:6px;border-radius:50%;background:#4f46e5}
.info-title{font-size:20px;font-weight:500;color:#f1f5f9;line-height:1.35;margin-bottom:10px;min-height:56px}
.info-body{font-size:13px;color:#94a3b8;line-height:1.75;margin-bottom:16px;min-height:88px}
.info-action{display:flex;align-items:flex-start;gap:10px;background:#ffffff08;border:0.5px solid #ffffff12;border-radius:10px;padding:11px 13px}
.action-icon{width:26px;height:26px;border-radius:7px;background:#4f46e5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action-text{font-size:12px;color:#cbd5e1;line-height:1.6}
.progress{display:flex;gap:5px;margin-top:20px}
.prog-seg{height:3px;border-radius:2px;background:#ffffff15;flex:1;transition:background .3s}
.prog-seg.done{background:#16a34a}
.prog-seg.active{background:#4f46e5}
.controls{display:flex;gap:8px;margin-top:14px}
.ctrl{flex:1;height:34px;border-radius:8px;border:0.5px solid #ffffff18;background:#ffffff08;color:#cbd5e1;font-size:12px;cursor:pointer;transition:background .15s}
.ctrl:hover{background:#ffffff14}
.ctrl.primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
.ctrl.primary:hover{background:#4338ca}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease}
</style>

<div class="scene">
  <!-- PHONE -->
  <div>
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="phone-notch"><div class="notch-cam"></div><div class="notch-spk"></div></div>
        <div class="screen-inner">
          <div class="s-header">
            <div class="s-logo">PMT · Plataforma de pagos</div>
            <h1>Activación de máquina</h1>
            <div class="s-sub">Lavandería · Sala A</div>
          </div>
          <div class="s-stepbar" id="stepbar"></div>
          <div class="s-body" id="sbody"></div>
        </div>
        <div class="s-homebar"><div></div></div>
      </div>
    </div>
  </div>

  <!-- INFO -->
  <div class="info-panel" id="infopanel">
    <div class="step-pill"><span class="dot"></span><span id="info-counter">Paso 1 de 4</span></div>
    <div class="info-title fade-up" id="info-title"></div>
    <div class="info-body fade-up" id="info-body"></div>
    <div class="info-action">
      <div class="action-icon">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
      </div>
      <div class="action-text" id="info-action"></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="controls">
      <button class="ctrl" onclick="prevStep()">← Anterior</button>
      <button class="ctrl primary" onclick="nextStep()">Siguiente →</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let cur=0, contactType='email', contactVal='', selectedMachine=null, processing=false;
let orderId='PMT-'+Math.floor(Math.random()*90000+10000);

const machines={
  lavadora:[1,2,3,4,5,6,7,8].map(n=>({n,occ:false})),
  secadora:[1,2,3,4,5,6].map(n=>({n,occ:false})),
  prontopet:[1,2].map(n=>({n,occ:false}))
};
const typeNames={lavadora:'Lavadora',secadora:'Secadora',prontopet:'ProntoPet'};
const typeColors={
  lavadora:{bg:'#e0e7ff',color:'#4f46e5',label:'L'},
  secadora:{bg:'#fef3c7',color:'#b45309',label:'S'},
  prontopet:{bg:'#fce7f3',color:'#be185d',label:'P'}
};

const stepInfo=[
  {counter:'Paso 1 de 4',title:'El cliente elige su máquina',body:'Al llegar a la lavandería escanea el QR de la sala y ve todas las máquinas disponibles. Elige el tipo — lavadora, secadora o ProntoPet — y el número que quiere usar.',action:'Tocar el número de la máquina deseada y presionar Continuar.'},
  {counter:'Paso 2 de 4',title:'Registra su contacto',body:'Ingresa su correo electrónico o número de WhatsApp. Esto garantiza que recibirá el QR de activación aunque cierre el navegador.',action:'Escribir correo o WhatsApp y presionar Continuar.'},
  {counter:'Paso 3 de 4',title:'Paga de forma segura',body:'Confirma el resumen con la máquina elegida y paga con tarjeta de débito o crédito a través de Webpay Plus. El cobro incluye cero comisión adicional.',action:'Presionar "Pagar $2.990 CLP" para completar la transacción.'},
  {counter:'Paso 4 de 4',title:'Recibe y usa su QR',body:'El QR aparece en pantalla de inmediato y también llega al correo o WhatsApp registrado. Es válido por 10 minutos y solo funciona en la máquina que eligió.',action:'Acercarse a la máquina y mostrar el QR al lector ESP32.'},
];

function setStepBar(active){
  const labels=['Máquina','Contacto','Pago','Tu QR'];
  $('stepbar').innerHTML=labels.map((l,i)=>`
    <div class="s-step${i<active?' done':i===active?' active':''}">
      <span class="n">${i<active?'✓':i+1}</span>${l}
    </div>`).join('');
}

function setProgress(active){
  $('progress').innerHTML=[0,1,2,3].map(i=>
    `<div class="prog-seg${i<active?' done':i===active?' active':''}"></div>`).join('');
}

function setInfo(idx){
  const s=stepInfo[idx];
  $('info-counter').textContent=s.counter;
  const t=$('info-title'); t.textContent=s.title; t.classList.remove('fade-up'); void t.offsetWidth; t.classList.add('fade-up');
  const b=$('info-body'); b.textContent=s.body; b.classList.remove('fade-up'); void b.offsetWidth; b.classList.add('fade-up');
  $('info-action').textContent=s.action;
  setProgress(idx);
}

function buildGrid(type){
  return machines[type].map(m=>{
    const sel=selectedMachine&&selectedMachine.type===type&&selectedMachine.n===m.n;
    return`<div class="m-btn${sel?' sel':''}" id="mb-${type}-${m.n}" onclick="pickMachine('${type}',${m.n})">
      <div class="m-num">${m.n}</div>
      <div class="m-stat">${sel?'Elegida':'Libre'}</div>
    </div>`;
  }).join('');
}

function renderStep0(){
  setStepBar(0); setInfo(0);
  const sections=Object.keys(machines).map(t=>{
    const c=typeColors[t];
    return`<div class="m-section">
      <div class="m-label"><span class="m-icon" style="background:${c.bg};color:${c.color}">${c.label}</span>${typeNames[t]}</div>
      <div class="m-grid" id="grid-${t}">${buildGrid(t)}</div>
    </div>`;
  }).join('');
  $('sbody').innerHTML=`
    <div class="s-title">Elige tu máquina</div>
    <div class="s-desc">Selecciona el tipo y número de máquina.</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot"></div>Disponible</div>
      <div class="leg-item"><div class="leg-dot sel"></div>Seleccionada</div>
    </div>
    ${sections}
    <button class="s-btn" id="btn0" onclick="goCur(1)" ${selectedMachine?'':'disabled'}>Continuar →</button>
  `;
}

function pickMachine(type,n){
  selectedMachine={type,n};
  document.querySelectorAll('.m-btn').forEach(b=>{b.classList.remove('sel');const s=b.querySelector('.m-stat');if(s)s.textContent='Libre';});
  const el=$(`mb-${type}-${n}`);
  if(el){el.classList.add('sel');el.querySelector('.m-stat').textContent='Elegida';}
  const b=$('btn0'); if(b) b.disabled=false;
}

function renderStep1(){
  setStepBar(1); setInfo(1);
  const mLabel=selectedMachine?(typeNames[selectedMachine.type]+' · N° '+selectedMachine.n):'';
  $('sbody').innerHTML=`
    <div class="s-title">Registra tu contacto</div>
    ${mLabel?`<div class="s-badge">${mLabel}</div>`:''}
    <div class="s-desc">Recibirás el QR al completar el pago.</div>
    <div class="s-radio">
      <div class="s-rbtn active" id="r-email" onclick="switchC('email')">Correo</div>
      <div class="s-rbtn" id="r-wa" onclick="switchC('wa')">WhatsApp</div>
    </div>
    <div class="s-field">
      <div class="s-lbl" id="clbl">Correo electrónico</div>
      <input class="s-input" type="email" id="cinput" placeholder="tucorreo@ejemplo.com"/>
      <div class="s-hint" id="chint">Te enviaremos el QR a esta dirección.</div>
    </div>
    <button class="s-btn" onclick="validateC()">Continuar →</button>
    <button class="s-btn sec" onclick="goCur(0)">← Volver</button>
  `;
}

function switchC(type){
  contactType=type;
  $('r-email').className='s-rbtn'+(type==='email'?' active':'');
  $('r-wa').className='s-rbtn'+(type==='wa'?' active':'');
  if(type==='email'){$('clbl').textContent='Correo electrónico';$('cinput').type='email';$('cinput').placeholder='tucorreo@ejemplo.com';$('chint').textContent='Te enviaremos el QR a esta dirección.';}
  else{$('clbl').textContent='Número de WhatsApp';$('cinput').type='tel';$('cinput').placeholder='+56 9 1234 5678';$('chint').textContent='Te enviaremos el QR por WhatsApp.';}
}

function validateC(){
  const v=$('cinput').value.trim();
  if(!v){$('cinput').style.borderColor='#ef4444';return;}
  contactVal=v; goCur(2);
}

function renderStep2(){
  setStepBar(2); setInfo(2);
  const mLabel=selectedMachine?(typeNames[selectedMachine.type]+' · N° '+selectedMachine.n):'';
  $('sbody').innerHTML=`
    <div class="s-title">Resumen del pago</div>
    <div class="s-price">
      <div class="s-prow"><span>${mLabel}</span><span>$2.990</span></div>
      <div class="s-prow"><span>Comisión</span><span>$0</span></div>
      <div class="s-prow tot"><span>Total</span><span>$2.990 CLP</span></div>
    </div>
    <div class="s-wpbox">
      <div class="s-wph"><div class="s-wplogo">Webpay</div><span>Plus · Pago seguro</span></div>
      <div class="s-wpb">
        <div class="s-card">
          <div class="s-chip"></div>
          <div class="s-cnum">•••• •••• •••• 4242</div>
          <div class="s-cmeta"><span>TARJETA DE PRUEBA</span><span>12/27</span></div>
        </div>
        <div class="s-field"><div class="s-lbl">Número de tarjeta</div>
          <input class="s-input" value="4111 1111 1111 1111" readonly style="color:#9ca3af;background:#f9fafb"/></div>
        <div style="display:flex;gap:5px">
          <div class="s-field" style="flex:1"><div class="s-lbl">Vencimiento</div><input class="s-input" value="12/27" readonly style="color:#9ca3af;background:#f9fafb"/></div>
          <div class="s-field" style="flex:1"><div class="s-lbl">CVV</div><input class="s-input" value="123" readonly style="color:#9ca3af;background:#f9fafb"/></div>
        </div>
      </div>
    </div>
    <button class="s-btn" id="paybtn" onclick="processPay()">Pagar $2.990 CLP</button>
    <button class="s-btn sec" onclick="goCur(1)">← Volver</button>
  `;
}

function processPay(){
  if(processing)return; processing=true;
  $('sbody').innerHTML=`
    <div style="text-align:center;padding:12px 0">
      <div style="width:40px;height:40px;border-radius:50%;background:#fff3f3;display:flex;align-items:center;justify-content:center;margin:0 auto 8px">
        <div class="s-wplogo" style="font-size:8px">Webpay</div>
      </div>
      <div class="s-title" style="margin-bottom:4px">Procesando pago</div>
      <div class="s-desc">Verificando con Transbank...</div>
      <div class="s-loadbar"><div class="s-loadfill"></div></div>
      <div style="font-size:8.5px;color:#6b7280" id="pmsg">Conectando con el banco...</div>
    </div>
  `;
  const msgs=['Verificando tarjeta...','Autorizando transacción...','Pago aprobado ✓'];
  let i=0;
  const iv=setInterval(()=>{if($('pmsg'))$('pmsg').textContent=msgs[i]||msgs[2];i++;if(i>2){clearInterval(iv);setTimeout(()=>{processing=false;goCur(3);},500);}},800);
}

function renderStep3(){
  setStepBar(3); setInfo(3);
  const mLabel=selectedMachine?(typeNames[selectedMachine.type]+' N° '+selectedMachine.n):'';
  const cLabel=contactType==='email'?'correo electrónico':'WhatsApp';
  $('sbody').innerHTML=`
    <div style="text-align:center">
      <div class="s-check">
        <svg fill="none" viewBox="0 0 24 24" stroke="#16a34a" stroke-width="2.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="s-title" style="text-align:center;margin-bottom:3px">¡Pago aprobado!</div>
      <div style="font-size:8px;color:#6b7280;margin-bottom:7px">Orden <span class="s-tag">${orderId}</span></div>
      <div class="s-mtag">${mLabel}</div>
      <div class="s-qrwrap">
        <svg viewBox="0 0 40 40" width="100" height="100">
          <rect width="40" height="40" fill="white"/>
          <rect x="10" y="10" width="7" height="7" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
          <rect x="13" y="13" width="1" height="1" fill="#1a1a2e"/>
          <rect x="23" y="10" width="7" height="7" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
          <rect x="26" y="13" width="1" height="1" fill="#1a1a2e"/>
          <rect x="10" y="23" width="7" height="7" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
          <rect x="13" y="26" width="1" height="1" fill="#1a1a2e"/>
          <rect x="17" y="17" width="2" height="2" fill="#1a1a2e"/>
          <rect x="21" y="17" width="2" height="2" fill="#1a1a2e"/>
